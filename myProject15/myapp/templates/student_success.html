<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Success</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-container {
            width: 400px;
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            width: 70px;
            height: 70px;
            background: #28a745;
            color: white;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto 20px;
            font-size: 35px;
        }

        h2 {
            color: #28a745;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
        }

        a:hover {
            background: #574fd6;
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="success-icon">
            ✓
        </div>

        <h2>Student Added Successfully!</h2>

        <p>The student information has been saved successfully.</p>

        <a href="/">Add Another Student</a>

    </div>

</body>
</html>
