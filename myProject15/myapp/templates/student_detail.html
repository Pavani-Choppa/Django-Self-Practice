<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Detail</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .student-card {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .detail {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 7px;
            border-left: 4px solid #6c63ff;
        }

        .detail strong {
            color: #444;
        }

        .detail span {
            color: #666;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            padding: 12px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #574fd6;
        }
    </style>
</head>

<body>

    <div class="student-card">

        <h1>Student Details</h1>

        <div class="detail">
            <strong>Name:</strong>
            <span>{{ student.name }}</span>
        </div>

        <div class="detail">
            <strong>Email:</strong>
            <span>{{ student.email }}</span>
        </div>

        <div class="detail">
            <strong>Age:</strong>
            <span>{{ student.age }}</span>
        </div>

        

        <a href="{% url 'student_list' %}" class="back-btn">
            ← Back to Student List
        </a>

    </div>

</body>
</html>
