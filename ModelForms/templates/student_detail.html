<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .detail-box {
            background-color: white;
            width: 450px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .detail {
            background-color: #f8f9fa;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }

        .detail strong {
            color: #555;
            margin-right: 8px;
        }

        .back-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 11px;
            border-radius: 5px;
            margin-top: 25px;
        }

        .back-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="detail-box">

        <h2>Student Details</h2>

        <div class="detail">
            <strong>Name:</strong>
            {{ student.name }}
        </div>

        <div class="detail">
            <strong>Age:</strong>
            {{ student.age }}
        </div>

        <div class="detail">
            <strong>Email:</strong>
            {{ student.email }}
        </div>

        <a href="{% url 'student_list' %}" class="back-btn">
            ← Back To Student List
        </a>

    </div>

</body>
</html>
