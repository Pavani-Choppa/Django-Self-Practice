<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Confirm</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .delete-box {
            background-color: white;
            padding: 35px;
            width: 400px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 10px;
        }

        .delete-btn:hover {
            background-color: #b02a37;
        }

        .cancel-btn {
            text-decoration: none;
            background-color: #6c757d;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            font-size: 15px;
        }

        .cancel-btn:hover {
            background-color: #545b62;
        }
    </style>
</head>

<body>

    <div class="delete-box">
        <h2>Do You Want to Delete {{ student.name }}?</h2>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="delete-btn">
                Yes, Delete
            </button>

            <a href="{% url 'student_list' %}" class="cancel-btn">
                Cancel
            </a>
        </form>
    </div>

</body>
</html>
