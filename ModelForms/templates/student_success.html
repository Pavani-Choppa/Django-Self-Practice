<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Created</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .success-box {
            background-color: white;
            width: 400px;
            text-align: center;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #28a745;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 10px 18px;
            margin: 8px;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .list-btn {
            background-color: #28a745;
        }

        .list-btn:hover {
            background-color: #1e7e34;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <h2>Student Created Successfully 🎉</h2>

        <a href="{% url 'student_create' %}" class="btn">
            Add Another Student
        </a>

        <br>

        <a href="{% url 'student_list' %}" class="btn list-btn">
            Student List
        </a>

    </div>

</body>
</html>
