<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .add-btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .add-btn:hover {
            background-color: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .student-name {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .student-name:hover {
            color: #007bff;
        }

        .actions a {
            text-decoration: none;
            margin-left: 10px;
            font-size: 14px;
        }

        .edit {
            color: #28a745;
        }

        .delete {
            color: #dc3545;
        }

        .edit:hover,
        .delete:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>All Student Data</h1>

        <a href="{% url 'student_create' %}" class="add-btn">
            + Add New Student
        </a>

        <ul>

            {% for s in students %}

                <li>

                    <a href="{% url 'student_detail' s.id %}" class="student-name">
                        {{ s.name }} — {{ s.email }}
                    </a>

                    <div class="actions">

                        <a href="{% url 'student_edit' s.id %}" class="edit">
                            Edit
                        </a>

                        <a href="{% url 'student_delete' s.id %}" class="delete">
                            Delete
                        </a>

                    </div>

                </li>

            {% empty %}

                <li>
                    No students found.
                </li>

            {% endfor %}

        </ul>

    </div>

</body>
</html>
