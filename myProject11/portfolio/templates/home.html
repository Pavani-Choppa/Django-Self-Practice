<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Helooooooooooooooo</h1>
    <h1>Student Details</h1>
    {% if students %}
        <table border="1" style="border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>City</th>
                </tr>
            </thead>

            <tbody>
                {% for student in students %}
                    <tr>
                        <td>{{ student.name }}</td>
                        <td>{{ student.age }}</td>
                        <td>{{ student.city }}</td>
                    </tr>
                {% endfor %}
            </tbody>
            {% else %}
            <p> No Values in The Database </p>
        </table>
    {% endif %}

</body>
</html>
