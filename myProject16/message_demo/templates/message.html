<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .debug{color: gray;}
        .success{color: green;}
        .warning{color: orange;}
        .info{color: blue;}
        .error{color: red;}
    </style>
</head>
<body>
        <h2>MEssaggages to show</h2>
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li class="{{message.tags}}">{{message}}</li>
                {% endfor %}
            </ul>
        {% endif %}
</body>
</html>
